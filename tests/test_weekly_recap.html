<!doctype html><meta charset="utf-8"><title>weekly recap — montador do e-mail</title>
<body><pre id="out">rodando…</pre>
<script src="/weekly-lib.js"></script>
<script>
/* Testa o weekly-lib.js — o montador do "Weekly Recap S&M/P&P".
   O GABARITO é o e-mail REAL da semana encerrada em 28/08/2026 (o que o analista
   mandou como referência): os fechamentos e as variações abaixo foram copiados de
   lá, número por número. Se a conta desta biblioteca divergir daquele e-mail, o
   teste quebra — que é exatamente o ponto.

   Rodar: servir a pasta IBBA-Research-Dashboard e abrir /tests/test_weekly_recap.html
   (o harness do preview_harness.py já serve nessa raiz).                            */
const R=[], ok=(n,c,d='')=>R.push((c?'PASS':'FAIL')+' · '+n+(d?'  ['+d+']':''));
const W=window.IBBAWeekly;
const ts=(y,m,d)=>Date.UTC(y,m-1,d,12,0,0)/1000;   // meio-dia UTC: imune a fuso

// ══ 1. janela da semana ══════════════════════════════════════════════════════
// A régua é WoW: `fim` é o dia escolhido e `ini` é o MESMO dia da semana anterior.
// Até 01/09/2026 a função recuava tudo para a sexta mais recente — o que travava a
// tela em sexta-feira. Os testes abaixo guardam a regra nova.
(function(){
  // sexta 28/08/2026 — o caso de sempre, o weekly de verdade
  const s=W.semanaDe(new Date(2026,7,28));
  ok('sexta-feira aponta para ela mesma',
     W.dbarra(s.fim)==='28/08/2026', W.dbarra(s.fim));
  ok('o par de fechamentos é sexta-a-sexta (21 → 28)',
     W.dbarra(s.ini)==='21/08/2026', W.dbarra(s.ini));
  ok('as notícias começam na SEGUNDA da semana que fechou (24/08), não em 21/08',
     W.dbarra(s.seg)==='24/08/2026', W.dbarra(s.seg));
  ok('período por extenso: "24 a 28 de agosto de 2026"',
     W.periodoLongo(s.seg,s.fim)==='24 a 28 de agosto de 2026', W.periodoLongo(s.seg,s.fim));
  ok('os 5 dias úteis saem na ordem segunda→sexta',
     W.diasUteis(s).map(d=>d.rotulo).join('|')==='Segunda, 24/ago|Terça, 25/ago|Quarta, 26/ago|Quinta, 27/ago|Sexta, 28/ago',
     W.diasUteis(s).map(d=>d.rotulo).join('|'));

  // ── qualquer dia útil vale como referência ─────────────────────────────────
  const q=W.semanaDe(new Date(2026,7,26));                 // quarta 26/08
  ok('quarta-feira aponta para ELA MESMA (não recua para a sexta)',
     W.dbarra(q.fim)==='26/08/2026', W.dbarra(q.fim));
  ok('…e compara com a quarta anterior (19/08) — WoW de verdade',
     W.dbarra(q.ini)==='19/08/2026', W.dbarra(q.ini));
  ok('…a janela de notícias são os 5 pregões que terminam nela (20/08 → 26/08)',
     W.dbarra(q.seg)==='20/08/2026', W.dbarra(q.seg));
  ok('…e ela atravessa o fim de semana SEM sábado nem domingo na lista',
     W.diasUteis(q).map(d=>d.rotulo).join('|')==='Quinta, 20/ago|Sexta, 21/ago|Segunda, 24/ago|Terça, 25/ago|Quarta, 26/ago',
     W.diasUteis(q).map(d=>d.rotulo).join('|'));

  const g=W.semanaDe(new Date(2026,7,31));            // segunda 31/08
  ok('segunda-feira também vale como referência',
     W.dbarra(g.fim)==='31/08/2026', W.dbarra(g.fim));
  ok('…contra a segunda anterior (24/08)', W.dbarra(g.ini)==='24/08/2026', W.dbarra(g.ini));
  ok('…com os 5 pregões terça→segunda',
     W.diasUteis(g).map(d=>d.rotulo).join('|')==='Terça, 25/ago|Quarta, 26/ago|Quinta, 27/ago|Sexta, 28/ago|Segunda, 31/ago',
     W.diasUteis(g).map(d=>d.rotulo).join('|'));

  // nenhum dia útil pode gerar sábado/domingo no esqueleto do bloco de notícias
  let sujo='';
  for(var i=24;i<=28;i++){
    W.diasUteis(W.semanaDe(new Date(2026,7,i))).forEach(d=>{
      if(d.data.getDay()===0||d.data.getDay()===6) sujo+=d.rotulo+' ';
    });
  }
  ok('nenhuma referência produz fim de semana na lista de dias', sujo==='', sujo);

  // ── fim de semana ainda recua (não há pregão nem assessment) ───────────────
  ok('sábado recua para a sexta',
     W.dbarra(W.semanaDe(new Date(2026,7,29)).fim)==='28/08/2026',
     W.dbarra(W.semanaDe(new Date(2026,7,29)).fim));
  ok('domingo recua para a sexta',
     W.dbarra(W.semanaDe(new Date(2026,7,30)).fim)==='28/08/2026');

  // ── o PADRÃO da tela continua sendo a sexta mais recente ───────────────────
  ok('sextaMaisRecente: numa segunda devolve a sexta anterior',
     W.dbarra(W.sextaMaisRecente(new Date(2026,7,31)))==='28/08/2026',
     W.dbarra(W.sextaMaisRecente(new Date(2026,7,31))));
  ok('sextaMaisRecente: numa sexta devolve o próprio dia',
     W.dbarra(W.sextaMaisRecente(new Date(2026,7,28)))==='28/08/2026');
  ok('sextaMaisRecente: num domingo devolve a sexta anterior',
     W.dbarra(W.sextaMaisRecente(new Date(2026,7,30)))==='28/08/2026');

  // virada de mês: 28/09 a 02/10 tem de citar os DOIS meses
  const v=W.semanaDe(new Date(2026,9,3));                  // sábado → sexta 02/10
  ok('semana que vira o mês cita os dois meses',
     W.periodoLongo(v.seg,v.fim)==='28 de setembro a 2 de outubro de 2026',
     W.periodoLongo(v.seg,v.fim));
})();

// ══ 2. leitura de série ══════════════════════════════════════════════════════
(function(){
  const s=W.semanaDe(new Date(2026,7,28));
  const serie=[[ts(2026,8,19),90],[ts(2026,8,20),92],[ts(2026,8,21),95.45],
               [ts(2026,8,24),96],[ts(2026,8,27),97],[ts(2026,8,28),98.60]];
  ok('pega o fechamento do dia exato', W.pontoAte(serie,s.fim).v===98.60);
  ok('não enxerga o futuro (21/ago não vê o 24)', W.pontoAte(serie,s.ini).v===95.45);
  // feriado / assessment semanal: cai no ponto anterior E devolve a data real,
  // que é o que a tela usa para carimbar "27/ago" ao lado do número
  const semanal=[[ts(2026,8,20),564.79],[ts(2026,8,27),563.64]];
  const p=W.pontoAte(semanal,s.fim);
  ok('série semanal: usa o assessment mais recente até a sexta', p.v===563.64);
  ok('…e devolve a data REAL do assessment (27/ago), não a sexta pedida',
     W.dmes(p.data)==='27/ago', W.dmes(p.data));
  ok('série vazia devolve null', W.pontoAte([],s.fim)===null);
  ok('data anterior a toda a série devolve null',
     W.pontoAte(serie,new Date(2026,0,5))===null);
  ok('ponto com valor nulo é ignorado',
     W.pontoAte([[ts(2026,8,27),null],[ts(2026,8,26),50]],s.fim).v===50);
})();

// ══ 2b. o CARIMBO da série é lido em UTC ═════════════════════════════════════
// O bug de 01/09/2026: os robôs gravam o assessment à MEIA-NOITE UTC, e a tela lia o
// dia no fuso do navegador — em Brasília a meia-noite UTC de 28/ago é 27/ago às 21h,
// então TODAS as linhas apareciam carimbadas com um dia a menos ("27/ago" no
// assessment de 28). O gabarito acima usa MEIO-DIA UTC e por isso nunca pegou nada.
(function(){
  const s=W.semanaDe(new Date(2026,7,28));
  const meia=(y,m,d)=>Date.UTC(y,m-1,d,0,0,0)/1000;      // como o robô grava de verdade
  const serie=[[meia(2026,8,21),95.45],[meia(2026,8,28),98.60]];
  const b=W.pontoAte(serie,s.fim), a=W.pontoAte(serie,s.ini);
  ok('assessment carimbado à meia-noite UTC é do DIA dele, não do anterior',
     W.dmes(b.data)==='28/ago', W.dmes(b.data));
  ok('…dos dois lados da janela', W.dmes(a.data)==='21/ago', W.dmes(a.data));
  ok('e o valor continua sendo o do dia pedido', b.v===98.60 && a.v===95.45);
  ok('carimbo do meio do dia (série do Yahoo) continua no dia certo',
     W.dmes(W.pontoAte([[ts(2026,8,28),1]],s.fim).data)==='28/ago');
})();

// ══ 2c. PREÇO DE TELA (weekly montado com o pregão aberto) ═══════════════════
// Regra do analista (01/09/2026): rodando na sexta às ~16h, a coluna da direita é a
// ÚLTIMA COTAÇÃO PUXADA, comparada com o FECHAMENTO de uma semana atrás.
(function(){
  const s=W.semanaDe(new Date(2026,7,28));                // a sexta é o próprio dia
  const meia=(y,m,d)=>Date.UTC(y,m-1,d,0,0,0)/1000;
  const sexta=new Date(2026,7,28), pego=new Date(2026,7,28,16,42);
  // série sem o dia de hoje: às 16h o fechamento da sexta ainda não existe
  const base=()=>W.linhaDeSerie('VALE3',[[meia(2026,8,21),75.03],[meia(2026,8,27),77.10]],s,2,'R$ ');

  const l=W.aplicarAoVivo(base(),78.39,sexta,pego);
  ok('a tela substitui o último fechamento', l.fim.v===78.39, String(l.fim.v));
  ok('…o Δ é tela ÷ fechamento de uma semana atrás', W.pct(l.delta)==='+4,48%', W.pct(l.delta));
  ok('…o carimbo vira o dia de hoje', W.dmes(l.fim.data)==='28/ago', W.dmes(l.fim.data));
  ok('…e a hora da puxada fica na linha', W.hhmm(l.aoVivo)==='16h42', W.hhmm(l.aoVivo));
  ok('a coluna da esquerda NÃO se mexe', l.ini.v===75.03);

  ok('sem preço ao vivo a linha continua no fechamento',
     W.aplicarAoVivo(base(),null,sexta,pego).fim.v===77.10);
  // trava anti-retrocesso: histórico mais NOVO que a cotação manda (robô parado)
  const velho=W.aplicarAoVivo(base(),70.00,new Date(2026,7,25),new Date(2026,7,25,16,0));
  ok('cotação mais VELHA que o histórico é ignorada', velho.fim.v===77.10, String(velho.fim.v));
  ok('…e sem ela a linha não se diz ao vivo', !velho.aoVivo);
  ok('o instante mais recente é o que a tela mostra',
     W.hhmm(W.ultimoAoVivo([base(),l]))==='16h42');
  ok('sem nenhuma linha ao vivo, não há instante', W.ultimoAoVivo([base()])===null);

  // a legenda do e-mail tem de DIZER que não é fechamento
  const mv={semana:s,precos:[l],acoes:[l],dias:[],relatorios:[]};
  const htmlv=W.buildEmail(mv);
  ok('o e-mail avisa que a coluna é a última cotação, com a hora',
     htmlv.indexOf('contra a última cotação de 28/08/2026, às 16h42')>0);
  ok('…e não chama isso de fechamento de 28/08',
     htmlv.indexOf('Fechamento de 21/08/2026 contra 28/08/2026')<0);
  const mf={semana:s,precos:[base()],acoes:[base()],dias:[],relatorios:[]};
  ok('semana já encerrada continua fechamento contra fechamento',
     W.buildEmail(mf).indexOf('Fechamento de 21/08/2026 contra 28/08/2026')>0);

  // e a prosa tem de mudar de verbo junto com o número
  const pv=W.aplicarAoVivo(base(),78.39,sexta,pego); pv.prosa='minério de ferro'; pv.unidadeProsa='US$/t';
  const txt=W.rascunhoCommodities([pv]);
  ok('rascunho com pregão aberto não diz "encerrou a semana"', txt.indexOf('encerrou')<0, txt);
  ok('…diz "está em … na semana"', /está em .* na semana\.$/.test(txt), txt);
})();

// ══ 2d. REFERÊNCIA FORA DE SEXTA, SÉRIE SEMANAL ══════════════════════════════
// Exigência do analista (01/09/2026): *"os preços de celulose não são diários, aparecem
// apenas na sexta, então usar o último 'mais atualizado' até aquela data… tem que fazer
// sentido o que estamos fazendo"*. Ou seja: a comparação continua WoW, mas de assessment
// a assessment — nunca comparando um número com ele mesmo, nunca inventando o dia.
(function(){
  const meia=(y,m,d)=>Date.UTC(y,m-1,d,0,0,0)/1000;          // como o robô grava
  const q=W.semanaDe(new Date(2026,7,26));                    // QUARTA 26/08
  // celulose: só sextas
  const semanal=[[meia(2026,8,7),566.00],[meia(2026,8,14),565.20],[meia(2026,8,21),563.64]];
  const lp=W.linhaDeSerie('BHKP',semanal,q,2,'');
  ok('semanal numa quarta: a ponta direita é o assessment de 21/ago', lp.fim.v===563.64);
  ok('…e a esquerda é o de 14/ago, não o mesmo 21/ago (senão o Δ seria zero)',
     lp.ini.v===565.20, String(lp.ini&&lp.ini.v));
  ok('…as duas datas são as REAIS dos assessments',
     W.dmes(lp.ini.data)+'|'+W.dmes(lp.fim.data)==='14/ago|21/ago',
     W.dmes(lp.ini.data)+'|'+W.dmes(lp.fim.data));
  ok('…e o Δ é a variação de um assessment para o outro',
     W.pct(lp.delta)==='−0,28%', W.pct(lp.delta));

  // minério: diário — aí a quarta compara com a quarta
  const diaria=[[meia(2026,8,19),95.10],[meia(2026,8,20),95.30],[meia(2026,8,21),95.45],
                [meia(2026,8,24),96.10],[meia(2026,8,25),97.00],[meia(2026,8,26),98.60]];
  const ld=W.linhaDeSerie('IODEX',diaria,q,2,'');
  ok('diário numa quarta: quarta 26/08 contra quarta 19/08',
     ld.fim.v===98.60 && ld.ini.v===95.10, ld.ini.v+'→'+ld.fim.v);
  ok('…com as duas pontas carimbadas no próprio dia',
     W.dmes(ld.ini.data)+'|'+W.dmes(ld.fim.data)==='19/ago|26/ago',
     W.dmes(ld.ini.data)+'|'+W.dmes(ld.fim.data));

  // feriado na ponta: cai no pregão anterior, e a data DIZ isso
  const comFeriado=[[meia(2026,8,19),95.10],[meia(2026,8,25),97.00]];
  const lf=W.linhaDeSerie('IODEX',comFeriado,q,2,'');
  ok('sem pregão na data pedida, usa o anterior e carimba a data real',
     lf.fim.v===97.00 && W.dmes(lf.fim.data)==='25/ago', W.dmes(lf.fim&&lf.fim.data));

  // e o e-mail continua honesto sobre QUE datas comparou
  const html=W.buildEmail({semana:q,precos:[lp,ld],acoes:[],dias:[],relatorios:[]});
  ok('o e-mail diz o par de datas da janela, não "a semana"',
     html.indexOf('Fechamento de 19/08/2026 contra 26/08/2026')>0);
})();

// ══ 3. GABARITO — os números do e-mail de 28/08/2026 ════════════════════════
// Cada linha: [rótulo, fechamento 21/ago, fechamento 28/ago, variação que o
// analista mandou]. A conta da lib tem de bater com a última coluna.
const SEM=W.semanaDe(new Date(2026,7,28));
const serie2=(a,b)=>[[ts(2026,8,21),a],[ts(2026,8,28),b]];
const GAB_PRECOS=[
  ['Iodex CFR China 61% Fe', 95.45,  98.60,  '+3,30%',  2],
  ['HRC China',             490,    500,     '+2,04%',  0],
  ['Rebar Turquia',         580,    590,     '+1,72%',  0],
  ['Pulp China BHKP',       564.79, 563.64,  '−0,20%',  2],
  ['Pulp China NBSK',       635.05, 638.72,  '+0,58%',  2],
];
const GAB_ACOES=[
  ['USIM5',    6.55,   7.23,   '+10,38%'],
  ['CSNA3',    4.79,   5.23,   '+9,19%'],
  ['GGBR4',   22.15,  23.82,   '+7,54%'],
  ['VALE3',   75.03,  78.39,   '+4,48%'],
  ['SUZB3',   44.97,  46.21,   '+2,76%'],
  ['IBOV', 171032, 175696,     '+2,73%'],
  ['KLBN11',  18.49,  18.99,   '+2,70%'],
  ['CMIN3',    5.90,   5.97,   '+1,19%'],
  ['RANI3',    7.74,   7.76,   '+0,26%'],
  ['AURA33', 149.00, 145.28,   '−2,50%'],
];
const precos=GAB_PRECOS.map(g=>{
  const l=W.linhaDeSerie(g[0],serie2(g[1],g[2]),SEM,g[4],''); l.unidade='US$/t';
  // como a tela manda: nome e unidade PARA A PROSA, diferentes dos da tabela
  l.prosa=g[0]==='Iodex CFR China 61% Fe'?'minério de ferro (IODEX 61% Fe)':g[0];
  l.unidadeProsa=g[4]===2&&g[0].indexOf('Iodex')===0?'US$/dmt':'US$/t';
  return l;
});
const acoes=GAB_ACOES.map(g=>
  W.linhaDeSerie(g[0],serie2(g[1],g[2]),SEM,g[0]==='IBOV'?0:2,g[0]==='IBOV'?'':'R$ '));

GAB_PRECOS.forEach((g,i)=>ok('preço "'+g[0]+'" fecha em '+g[3]+' (como no e-mail)',
  W.pct(precos[i].delta)===g[3], W.pct(precos[i].delta)));
GAB_ACOES.forEach((g,i)=>ok('ação '+g[0]+' fecha em '+g[3]+' (como no e-mail)',
  W.pct(acoes[i].delta)===g[3], W.pct(acoes[i].delta)));

// ══ 4. formatação em pt-BR ═══════════════════════════════════════════════════
(function(){
  ok('milhar com ponto e decimal com vírgula', W.num(175696,0)==='175.696', W.num(175696,0));
  ok('duas casas quando pedido', W.num(98.6,2)==='98,60', W.num(98.6,2));
  ok('negativo usa o menos tipográfico (−), não o hífen', W.pct(-2.4966)==='−2,50%', W.pct(-2.4966));
  ok('zero não leva sinal', W.pct(0)==='0,00%', W.pct(0));
  ok('sem dado vira travessão', W.num(null)==='—' && W.pct(undefined)==='—');
  ok('data curta em pt-BR', W.dmes(new Date(2026,7,28))==='28/ago', W.dmes(new Date(2026,7,28)));
})();

// ══ 5. rascunho da prosa ═════════════════════════════════════════════════════
(function(){
  const t=W.rascunhoCommodities(precos);
  ok('rascunho de commodities cita o fechamento da sexta',
     t.indexOf('98,60')>=0, t.slice(0,80));
  // o rascunho escreve como o analista escreve, não como a tabela rotula
  ok('…com o nome de prosa e a unidade no lugar certo ("US$ 98,60/dmt")',
     t.indexOf('O minério de ferro (IODEX 61% Fe) encerrou a semana em US$ 98,60/dmt')===0, t.slice(0,90));
  ok('…e sem `unidadeProsa` cai no prefixo da tabela',
     W.rascunhoCommodities([{rotulo:'X',casas:2,prefixo:'R$ ',
       fim:{v:10},ini:{v:9},delta:11.1}]).indexOf('em R$ 10,00,')>0);
  ok('…e a variação em palavras', /alta de ~3%/.test(t), t.slice(0,80));
  ok('recuo pequeno vira "queda de 0,2%"', /queda de 0,2%/.test(t), t.slice(-90));

  const c=W.rascunhoCompanhias(acoes,'IBOV');
  ok('rascunho de companhias começa pelo tom da semana',
     /majoritariamente positivo/.test(c), c.slice(0,70));
  ok('…compara com o IBOV', /ante \+2,73% do IBOV/.test(c), c.slice(0,140));
  ok('…lista os 3 maiores ganhos, em ordem',
     c.indexOf('USIM5 (+10,38%), CSNA3 (+9,19%) e GGBR4 (+7,54%)')>=0, c);
  ok('…e nomeia a única em queda com a frase certa',
     /AURA33 \(−2,50%\) foi a única ação da cobertura em queda/.test(c), c.slice(-120));
  ok('o IBOV não entra na lista de ganhadores (é referência, não cobertura)',
     c.indexOf('IBOV (+2,73%)')<0, c);

  const dias=[{rotulo:'Segunda, 24/ago',itens:[{texto:'Cortes de capacidade de celulose softwood.'},
                                               {texto:'Carvão metalúrgico atingiu USD 270,50/ton.'}]},
              {rotulo:'Terça, 25/ago',itens:[{texto:'Exportações chinesas de tarugos em recorde.'}]}];
  const n=W.rascunhoNoticias(dias);
  ok('rascunho de notícias numera i/ii/iii e junta com ponto e vírgula',
     n.indexOf('i) Cortes')===0 && n.indexOf('; ii) ')>0 && n.indexOf('; iii) ')>0, n);
  ok('…e tira o ponto final de cada item antes de emendar',
     n.indexOf('softwood;')>0, n);
  ok('sem dado, o rascunho sai vazio (a tela avisa em vez de inventar)',
     W.rascunhoCommodities([])==='' && W.rascunhoNoticias([])==='');
})();

// ══ 5b. RELATÓRIOS DA SEMANA (seleção automática pela data do Clipping) ══════
(function(){
  // formato REAL do Clipping: title = `name`, setor = CÓDIGO, e a data nova
  const PUBS=[
    {date:'2026-08-24', sector:'PP', name:'Klabin: Unleashing the Puma 2.0', link:'https://x/1'},
    {date:'2026-08-27', sector:'PP', name:'Irani: Gaia Wraps Up', link:'https://x/3'},
    {date:'2026-08-26', sector:'SM', name:'LatAm Pulp & Paper', link:'https://x/2'},
    {date:'2026-08-22', sector:'SM', name:'Sábado conta (semana começa no sábado)', link:''},
    {date:'2026-08-21', sector:'SM', name:'Sexta ANTERIOR: já foi no recap passado', link:''},
    {date:'2026-08-31', sector:'SM', name:'Semana que vem', link:''},

     /^Subject: =\?UTF-8\?B\?[A-Za-z0-9+/=]+\?=$/m.test(eml));
  // decodifica o assunto e confere o texto

// ══ 8. GUARDA: o Weekly NÃO PODE ESCREVER NADA DO CLIPPING ══════════════════
// Em 31/08/2026 a 1ª versão desta aba apagou publicações do Clipping: ela lia o
// título em `titulo` (o Clipping grava `name`), a lista aparecia em branco, e o
// botão de apagar escrevia de volta em `recent_publications`. O analista foi
// explícito depois disso: **o Weekly só consulta; quem manda na lista é o Clipping.**
// Estas asserções leem os FONTES e quebram se alguém reabrir essa porta.
async function guardaDeEscrita(){
  const src = await (await fetch('/weekly.html?v='+Date.now())).text();

  // a CHAMADA, não a menção: o arquivo cita o nome num comentário explicando por que
  // ela não pode ser usada aqui, e esse comentário tem de continuar existindo
  ok('o Weekly não CHAMA admin_save_clipping_config (ela troca a config INTEIRA)',
     src.indexOf("rpc('admin_save_clipping_config'")<0);
  ok('…e o comentário que explica o porquê segue no arquivo',
     src.indexOf('admin_save_clipping_config')>0);
  ok('…e grava só pela função que funde uma chave',
     src.indexOf("rpc('admin_save_weekly_config'")>0);
  // nenhuma atribuição a recent_publications (ler é permitido; escrever, não)
  const escritas=[...src.matchAll(/recent_publications\s*=[^=]/g)].length;
  ok('o Weekly nunca ATRIBUI recent_publications', escritas===0, 'atribuições='+escritas);
  ok('…e também não mexe em intro/earnings_review/analysts do Clipping',
     !/\b(intro|earnings_review|analysts)\s*=[^=]/.test(src.split('DEFAULT_INTRO')[1]||''));

  // a única chamada de ESCRITA no banco é a do weekly
  const rpcs=[...src.matchAll(/rpc\('([a-z_]+)'/g)].map(m=>m[1]);
  const escrita=rpcs.filter(n=>/^admin_(save|enqueue|delete|upsert|trigger)/.test(n));
  ok('a única RPC de escrita é admin_save_weekly_config',
     escrita.length===1 && escrita[0]==='admin_save_weekly_config', escrita.join(',')||'nenhuma');

  // e a função do banco de fato funde em vez de substituir
  const sql = await (await fetch('/admin/supabase_weekly_recap.sql?v='+Date.now())).text();
  ok('a função do banco existe no SQL', sql.indexOf('admin_save_weekly_config')>0);
  ok('…e funde a chave em vez de trocar o objeto (o `||` do jsonb)',
     /settings\s*=\s*public\.clipping_config\.settings\s*\|\|/.test(sql));
  ok('…gateada por is_admin()', /admin_save_weekly_config[\s\S]*?is_admin\(\)/.test(sql));

  // ── o preço da comp table é o MESMO da tabela de performance ──────────────
  // Exigência do analista: "esses preços spot têm que ser iguais aos que estarão no
  // weekly performance como o do dia de hoje". Isso não é uma coincidência de código:
  // as duas tabelas leem o fechamento pela MESMA função, na MESMA data.
  ok('a comp table busca o fechamento com pontoAte(..., S.sem.fim), como a performance',
     /precoNaData\[r\.ticker\]/.test(src) && /W\.pontoAte\(r\.daily\|\|\[\],\s*S\.sem\.fim\)/.test(src));
  ok('…e a conta dos múltiplos é a do Stock Guide, não uma cópia',
     src.indexOf('SG.deriveComps(')>0);
  ok('…com a lib do Stock Guide carregada na página',
     src.indexOf('stock-guide-lib.js')>0);
  ok('o Weekly não redefine nenhuma fórmula de múltiplo',
     !/function\s+deriveMultiples/.test(src) && !/evEbitdaY1\s*[:=]\s*[^,;]*\//.test(src));
  ok('empresa sem fechamento na data fica FORA da comp table (não inventa preço)',
     /if\(r\.livePrice==null\)\s*return;/.test(src));

  // ── e o PREÇO DE TELA é a mesma régua nas TRÊS tabelas ────────────────────
  // Se só a performance virasse tela, o mesmo papel sairia com dois preços dentro do
  // mesmo e-mail (um na tabela de ações, outro na comp table).
  ok('a tabela de ações aplica o preço de tela', /W\.aplicarAoVivo\(l,v\.price/.test(src));
  ok('…a comp table também', /W\.aplicarAoVivo\(l,r\.price/.test(src));
  ok('…e os preços das commodities idem', /W\.aplicarAoVivo\(l,r\.price,dia/.test(src));
  ok('a cotação ao vivo vem na MESMA busca do histórico (sem ida extra ao banco)',
     src.indexOf('quotes?select=ticker,daily,price,updated_at')>0);
  ok('a tela só entra quando a sexta de referência é HOJE',
     /function refEhHoje\(\)\{[^}]*ymd\(S\.sem\.fim\)===hojeSP\(\)/.test(src));
  ok('…e "hoje" é medido no relógio de São Paulo, não no do navegador',
     /hojeSP\(\)\{[^}]*America\/Sao_Paulo/.test(src));
  ok('o preço ao vivo das commodities sai de `commodities.price` (o do carrossel)',
     src.indexOf('commodities?select=code,price,assessed_at,updated_at')>0);
  ok('falha na busca ao vivo NÃO derruba a tabela (fica no fechamento)',
     /catch\(e\)\{ console\.warn\('preço ao vivo',e\); return; \}/.test(src));

  // ── a coluna da esquerda virou só o EDITOR (01/09/2026) ───────────────────
  // As 4 tabelas de conferência saíram: o analista não mexia em nenhuma delas e todas
  // já aparecem na prévia. O que não podia sair é o diagnóstico — daí o painel.
  ['pr-box','ac-box','rep-box','cp-box'].forEach(id=>
    ok('a tabela de conferência #'+id+' não está mais na tela', src.indexOf('"'+id+'"')<0));
  ok('…e nenhuma função de desenho delas sobrou',
     !/function render(Precos|Acoes|Relatorios|Comps)/.test(src));
  ok('o painel de diagnóstico existe no lugar', src.indexOf('function renderAuto()')>0);
  ok('…e ele abre sozinho quando há aviso',
     /if\(avisos\)\s*document\.getElementById\('auto'\)\.open=true/.test(src));
  ok('…dizendo de QUE DIA é cada número que não é da data pedida',
     src.indexOf('function _defasados(')>0 && src.indexOf('último assessment até ')>0);
  ok('o seletor de papéis sobreviveu (é escolha do analista, não leitura)',
     src.indexOf('id="tk-box"')>0 && src.indexOf('function renderTickers()')>0);

  // ── saída: só o .eml ─────────────────────────────────────────────────────
  ok('não há mais BOTÃO "Copiar para o Outlook"',
     !/id="copy"/.test(src) && src.indexOf('function copiar(')<0);
  ok('…nem a API de área de transferência', src.indexOf('ClipboardItem')<0);
  ok('…mas o comentário que explica a remoção segue no arquivo',
     src.indexOf('Copiar para o Outlook')>0);
  ok('…e o .eml continua sendo o caminho', src.indexOf('function baixarEml()')>0);

  // ── a janela pedida ao banco tem folga para série SEMANAL ────────────────
  // Celulose sai 1×/semana: pedir só o intervalo exato devolveria série vazia na ponta
  // esquerda quando a referência é, por exemplo, uma segunda-feira.
  ok('a busca de preços recua 30 dias antes de `ini` (celulose é semanal)',
     /S\.sem\.ini\.getDate\(\)-30/.test(src));
  ok('a comp table guarda de que DIA é o preço que usou',
     src.indexOf('datasPreco')>0 && /dataPreco:/.test(src));
  ok('o campo de data não aceita o futuro', /getElementById\('ref'\)\.max=hojeSP\(\)/.test(src));

  // e o Clipping segue dono da lista
  const clip = await (await fetch('/clipinator.html?v='+Date.now())).text();
  ok('o Clipping continua gravando pela função dele',
     clip.indexOf('admin_save_clipping_config')>0);
  ok('o Clipping ganhou a data da publicação (é o que o Weekly consulta)',
     clip.indexOf('pub-date')>0 && clip.indexOf("type=\"date\"")>0);
  ok('…nas DUAS listas (o Earnings Review também alimenta o weekly)',
     clip.indexOf("renderPubList('cfg-pubs', c.recent_publications, true)")>0 &&
     clip.indexOf("renderPubList('cfg-earn', c.earnings_review.items, true)")>0);
  ok('o Clipping segue dono do toggle do Earnings Review',
     clip.indexOf('cfg-earn-on')>0 || /earnings_review\.on/.test(clip));
}

// ── resultado ────────────────────────────────────────────────────────────────
function _publicar(){
  const falhas=R.filter(r=>r.startsWith('FAIL')).length;
  document.getElementById('out').textContent=
    R.join('\n')+'\n\n'+(R.length-falhas)+'/'+R.length+' PASS'+(falhas?'  ·  '+falhas+' FAIL':'  ·  tudo verde');
  window.__RESULT__={total:R.length,falhas:falhas,linhas:R};
}
_publicar();                       // o que é síncrono já aparece
guardaDeEscrita().catch(e=>ok('guarda de escrita rodou',false,String(e&&e.message||e)))
                 .then(_publicar); // …e a guarda repinta com o total final
</script>
</body>

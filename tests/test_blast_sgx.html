<!doctype html><meta charset="utf-8"><title>blast — destaque de minério + futuro SGX</title>
<body><pre id="out">rodando…</pre>
<iframe id="fr" src="/clipinator.html?cliptest=1" style="width:1200px;height:700px;border:1px solid #ccc"></iframe>
<script>
/* Pedido do analista (16/10/2026): quando um dos destaques do blast for a notícia de PREÇO do
   minério de ferro, a frase ganha "; hoje o futuro SGX subiu/caiu ~USD xx/ton". O número sai do
   banco (a linha IRON_ORE_SGX das cotações), nunca da IA.

   Roda a PÁGINA DE VERDADE num iframe (o hook ?cliptest=1 pula o login e expõe window.CLIP):
   se a regra mudar no clipinator.html, o teste quebra.

   ⚠️ As frases abaixo são INVENTADAS no molde das reais. A regra foi calibrada nos 96 destaques
   gravados de 01/09 a 16/10/2026 (14 de preço, 82 não), mas o texto real resume matéria paga e
   este repositório é público — por isso ele não mora aqui.

   Rodar: servir a pasta IBBA-Research-Dashboard e abrir /tests/test_blast_sgx.html */
const R=[], ok=(n,c,d='')=>R.push((c?'PASS':'FAIL')+' · '+n+(d?'  ['+d+']':''));

function esperar(fr){ return new Promise(res=>{
  const olha=()=>{ const w=fr.contentWindow;
    if(w && w.CLIP && w.CLIP.blComSgx && fr.contentDocument.getElementById('bl-out')) res(w.CLIP);
    else setTimeout(olha,60); };
  olha(); }); }

(async function(){
  const fr=document.getElementById('fr');
  const C=await esperar(fr), W=fr.contentWindow, D=fr.contentDocument;

  // ── 1) QUAL destaque é "a notícia de preço do minério" ─────────────────────
  const SIM=[
    ['preços DO minério',          'Os preços do minério de ferro caíram para USD 94,90/dmt, refletindo a cautela das usinas chinesas'],
    ['só o IODEX, sem "minério"',  'O Platts IODEX atingiu a mínima de dois anos em USD 91,05/ton, sem compradores chineses no feriado'],
    ['minério spot',               'O minério de ferro spot na Ásia recuou para USD 97,70/dmt com a volatilidade macro'],
    ['contrato + benchmark',       'O minério de ferro atingiu o menor nível em dois anos, com o contrato em Dalian a USD 100,36/ton'],
    ['junto com HRC na mesma frase','Preços de HRC na Ásia operam mistos, enquanto o mercado de minério de ferro cedeu para USD 99,55/dmt'],
    ['só o verbo, sem preço/dólar','O minério de ferro caiu 2% em Dalian com a demanda fraca das siderúrgicas'],
    ['teor no lugar de "de ferro"','O minério 62% recuou para USD 90/ton com a oferta australiana'],
    ['frete DEPOIS (o assunto é o preço)','Os preços do minério de ferro voltaram a USD 100,05/dmt, impulsionados por fretes marítimos elevados'],
    ['caixa alta e acento',        'MINÉRIO DE FERRO: PREÇOS SOBEM NA ÁSIA'],
    ['plural "minérios"',          'Os preços dos minérios de ferro de alto teor subiram na semana'],
  ];
  const NAO=[
    ['FRETE de minério (armadilha real, 03/09)','O frete marítimo de minério de ferro na rota Brasil-China atingiu USD 40,10/ton, o maior desde 2021'],
    ['IMPORTAÇÃO em toneladas (armadilha real, 09/09)','As importações chinesas de minério de ferro atingiram 108,54 milhões de toneladas em agosto'],
    ['minério de COBRE',           'A produção de cobre no Chile recuou pela queda nos teores de minério em grandes operações'],
    ['produção com verbo de movimento','A produção de minério de ferro da Vale caiu 2% no trimestre'],
    ['estoque nos portos',         'Estoques de minério de ferro nos portos chineses subiram para 140 milhões de toneladas'],
    ['projeto em dólar',           'A Vale aprovou projeto de minério de ferro de USD 2 bilhões em Minas Gerais'],
    ['outra commodity com preço',  'Os preços do carvão metalúrgico subiram para USD 275,50/ton FOB Austrália'],
    ['ferro gusa não é minério',   'Siderúrgicas chinesas reduziram a produção de aço bruto e de ferro gusa em setembro'],
    ['vazio',                      ''],
  ];
  SIM.forEach(([n,t])=>ok('é preço do minério: '+n, C.blEhMinerioPreco(t)===true, t.slice(0,60)));
  NAO.forEach(([n,t])=>ok('NÃO é preço do minério: '+n, C.blEhMinerioPreco(t)===false, t.slice(0,60)));
  ok('null não quebra', C.blEhMinerioPreco(null)===false);

  // ── 2) a frase: o número sai do banco, nunca da IA ──────────────────────────
  const AGORA=Date.parse('2026-10-16T09:00:00Z');
  const sgx=(price,pct,upd)=>({code:'IRON_ORE_SGX',price,change_pct:pct,assessed_at:'2026-10-16',
                               updated_at: upd===undefined ? '2026-10-16T08:55:00Z' : upd});
  const F=(r)=>C.blSgxFrase(r, AGORA);
  // 100 com -1% => fechamento anterior 101,01 => caiu 1,01
  ok('queda: "caiu ~USD 1/ton"', F(sgx(100,-1))==='hoje o futuro SGX caiu ~USD 1/ton', F(sgx(100,-1)));
  // 100 com +1,5% => fechamento 98,52 => subiu 1,48 -> 1,5 (vírgula pt-BR, como o resto do blast)
  ok('alta: "subiu ~USD 1,5/ton"', F(sgx(100,1.5))==='hoje o futuro SGX subiu ~USD 1,5/ton', F(sgx(100,1.5)));
  // o número do banco em 16/10/2026 às 19h26 UTC: 91,677 com +0,49%
  ok('número real de 16/10: subiu ~USD 0,4/ton', F(sgx(91.677,0.49))==='hoje o futuro SGX subiu ~USD 0,4/ton', F(sgx(91.677,0.49)));
  ok('movimento < 5 centavos vira "está estável" (nunca "~USD 0/ton")',
     F(sgx(100,0.02))==='hoje o futuro SGX está estável', F(sgx(100,0.02)));
  ok('PostgREST pode mandar número como texto', F(sgx('100','-1'))==='hoje o futuro SGX caiu ~USD 1/ton', F(sgx('100','-1')));
  ok('sem variação: nada (nunca um número inventado)', F(sgx(100,null))===null);
  ok('sem preço: nada', F(sgx(null,-1))===null);
  ok('sem linha no banco: nada', F(undefined)===null);
  ok('robô parado desde ontem (13h): nada — "hoje" seria mentira', F(sgx(100,-1,'2026-10-15T20:00:00Z'))===null);
  ok('11h de idade ainda vale', F(sgx(100,-1,'2026-10-15T22:00:00Z'))!==null);
  ok('sem carimbo de hora: nada', F(sgx(100,-1,null))===null);

  // ── 3) onde a frase entra ───────────────────────────────────────────────────
  const P={byCode:{IRON_ORE_SGX:sgx(100,-1)}, byTicker:{}};
  const dest=['A Suzano anunciou reajuste de USD 20/ton para a Ásia',
              'Os preços do minério de ferro recuaram para USD 94,90/dmt;',
              'O IODEX subiu para USD 95/ton.'];
  const antes=JSON.stringify(dest);
  const r=C.blComSgx(dest, P, AGORA);
  ok('só o PRIMEIRO destaque de minério ganha a frase (dois com o mesmo número = repetição)',
     r.lista[1].endsWith('; hoje o futuro SGX caiu ~USD 1/ton') && r.lista[2]===dest[2], r.lista[1]+' | '+r.lista[2]);
  ok('a pontuação que a IA deixou no fim sai antes do "; hoje"',
     r.lista[1]==='Os preços do minério de ferro recuaram para USD 94,90/dmt; hoje o futuro SGX caiu ~USD 1/ton', r.lista[1]);
  ok('os outros destaques ficam intactos', r.lista[0]===dest[0]);
  ok('a lista original não é tocada (o Weekly guarda o texto da IA)', JSON.stringify(dest)===antes);
  ok('e a tela sabe que a frase entrou', r.sgx && r.sgx.ok===true);
  ok('sem destaque de minério: nada muda e nada a avisar',
     (x=>x.sgx===null && JSON.stringify(x.lista)===JSON.stringify(dest.slice(0,1)))(C.blComSgx(dest.slice(0,1),P,AGORA)));
  const semRow=C.blComSgx(dest,{byCode:{},byTicker:{}},AGORA);
  ok('destaque de minério SEM o SGX no banco: frase não entra e o motivo é dito',
     semRow.lista[1]===dest[1] && semRow.sgx && semRow.sgx.ok===false && /não está no banco/.test(semRow.sgx.motivo), semRow.sgx&&semRow.sgx.motivo);
  const velho=C.blComSgx(dest,{byCode:{IRON_ORE_SGX:sgx(100,-1,'2026-10-15T08:00:00Z')}},AGORA);
  ok('…e com o SGX velho, idem', velho.sgx && /não é de hoje/.test(velho.sgx.motivo), velho.sgx&&velho.sgx.motivo);
  const semPct=C.blComSgx(dest,{byCode:{IRON_ORE_SGX:sgx(100,null)}},AGORA);
  ok('…e sem a variação do dia, idem', semPct.sgx && /sem a variação/.test(semPct.sgx.motivo), semPct.sgx&&semPct.sgx.motivo);

  // ── 4) o blast inteiro, como sai para o WhatsApp ────────────────────────────
  // _blPrices e _blDest são `let` da página: só se alcançam pelo eval DA PRÓPRIA janela.
  const agoraISO=new Date(Date.now()-5*60000).toISOString();
  W.eval('_blPrices='+JSON.stringify({byCode:{IRON_ORE_SGX:{code:'IRON_ORE_SGX',price:100,change_pct:-1,
        assessed_at:agoraISO.slice(0,10),updated_at:agoraISO}},byTicker:{}})+';'
        +'_blDest='+JSON.stringify(dest)+';');
  const txt=C.blBuild().texto, L=txt.split('\n');
  ok('no texto, o destaque de minério termina com a frase e o ";" da lista',
     L.indexOf('- Os preços do minério de ferro recuaram para USD 94,90/dmt; hoje o futuro SGX caiu ~USD 1/ton;')>=0,
     L.filter(l=>/^- /.test(l)).join(' || '));
  ok('o ÚLTIMO destaque continua fechando com "."', L.indexOf('- O IODEX subiu para USD 95/ton.')>=0);
  ok('e a linha de cotação do SGX segue lá, com o mesmo número', /62% _futuro SGX, \d\d\/\w{3}_ · USD 100,00\/ton · -1,00%/.test(txt));
  ok('montar o texto não altera os destaques guardados', W.eval('JSON.stringify(_blDest)')===antes);
  // gerar duas vezes não dobra a frase
  const txt2=C.blBuild().texto;
  ok('renderizar de novo não repete a frase', (txt2.match(/futuro SGX caiu/g)||[]).length===1);

  // ── 5) a tela avisa quando a frase NÃO entrou ───────────────────────────────
  W.eval('_blPrices={byCode:{},byTicker:{}}; blRender();');
  const aviso=D.getElementById('bl-warn');
  ok('sem SGX no banco, o aviso aparece em vez de a frase sumir calada',
     !aviso.hidden && /sem o futuro SGX/.test(aviso.textContent), aviso.textContent);
  W.eval('_blPrices='+JSON.stringify({byCode:{IRON_ORE_SGX:{code:'IRON_ORE_SGX',price:100,change_pct:-1,
        assessed_at:agoraISO.slice(0,10),updated_at:agoraISO}},byTicker:{}})+'; blRender();');
  // sem aviso nenhum o blRender só ESCONDE a caixa (o texto velho fica lá dentro, invisível)
  ok('com o SGX em dia, esse aviso some',
     aviso.hidden || !/sem o futuro SGX/.test(aviso.textContent), (aviso.hidden?'[oculto] ':'')+aviso.textContent);

  // ── 6) o Weekly guarda o texto da IA, sem o "hoje" ──────────────────────────
  const src=(await (await fetch('/clipinator.html?v='+Date.now())).text()).split('\r\n').join('\n');
  ok('o carimbo do dia (lido pelo Weekly) usa _blDest cru, não a lista com a frase',
     /blCarimbar\(_blDest,/.test(src));

  const falhas=R.filter(r=>r.startsWith('FAIL')).length;
  document.getElementById('out').textContent=
    R.join('\n')+'\n\n'+(R.length-falhas)+'/'+R.length+' PASS'+(falhas?'  ·  '+falhas+' FAIL':'  ·  tudo verde');
  window.__RESULT__={total:R.length,falhas:falhas,linhas:R};
})().catch(e=>{ document.getElementById('out').textContent='ERRO: '+(e&&e.message||e);
                window.__RESULT__={total:R.length,falhas:R.length||1,linhas:R.concat('ERRO '+e)}; });
</script>
</body>

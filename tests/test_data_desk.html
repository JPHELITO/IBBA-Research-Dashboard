<!doctype html>
<meta charset="utf-8">
<title>Data Desk — testes do núcleo (data-desk.js)</title>
<!-- Abrir pelo servidor de testes (ex.: http://127.0.0.1:8791/tests/test_data_desk.html). Sem Node: roda no navegador.
     O resultado fica em window.__RESULT = {pass, fail, falhas[]} e na tela. Só exercita IBBADesk.core (não toca na tela). -->
<style>body{font:13px/1.5 system-ui;margin:24px;max-width:900px} .ok{color:#1c7c45} .no{color:#b83227;font-weight:700} h1{font-size:16px}</style>
<h1>Data Desk — núcleo</h1><pre id="out"></pre>
<script src="../data-desk.js"></script>
<script src="../data-desk-help.js"></script>
<script src="../data-desk-builder.js"></script>
<script src="../data-desk-prices.js"></script>
<script>
const C = IBBADesk.core, R = { pass: 0, fail: 0, falhas: [] }, lines = [];
function eq(nome, a, b) { const ok = JSON.stringify(a) === JSON.stringify(b); ok ? R.pass++ : (R.fail++, R.falhas.push(nome)); lines.push((ok ? '✓ ' : '✗ ') + nome + (ok ? '' : '\n     obtido:   ' + JSON.stringify(a) + '\n     esperado: ' + JSON.stringify(b))); }
function near(nome, a, b, tol) { const ok = a != null && Math.abs(a - b) <= (tol || 1e-9); ok ? R.pass++ : (R.fail++, R.falhas.push(nome)); lines.push((ok ? '✓ ' : '✗ ') + nome + (ok ? '' : '  obtido ' + a + ' · esperado ' + b)); }

// ── eixo e alinhamento ──
const ax = C.axis('2023-11', '2026-10');
eq('eixo: 36 meses contínuos', [ax.length, ax[0], ax[2], ax[35]], [36, '2023-11', '2024-01', '2026-10']);
eq('alinhar: buraco vira null', C.align({ '2023-11': 1, '2024-01': 3 }, C.axis('2023-11', '2024-01')), [1, null, 3]);

// ── períodos: só os completos ──
const PM = C.buildPeriods(ax, 'monthly'), PQ = C.buildPeriods(ax, 'quarterly'), PA = C.buildPeriods(ax, 'annual');
eq('mensal: rótulo Oct-26 e chave 2026-10', [PM[35].label, PM[35].key], ['Oct-26', '2026-10']);
eq('trimestral: 4T23 (2 meses) e 4T26 (1 mês) ficam de fora', [PQ.length, PQ[0].label, PQ[PQ.length - 1].label], [11, '1Q24', '3Q26']);
eq('trimestral: rótulo em inglês e chave canônica', [PQ[3].label, PQ[3].key, PQ[3].a, PQ[3].b], ['4Q24', '2024-Q4', 11, 13]);
eq('anual: só 2024 e 2025 (2023 e 2026 incompletos)', PA.map(p => p.label), ['2024', '2025']);
const PQp = C.buildPeriods(ax, 'quarterly', true), PAp = C.buildPeriods(ax, 'annual', true);
eq('parcial (a pedido): o trimestre em andamento entra no fim, marcado', [PQp.length, PQp[PQp.length - 1].label, PQp[PQp.length - 1].partial, PQp[PQp.length - 1].months, PQp[0].label], [12, '4Q26 QTD', true, 1, '1Q24']);
eq('parcial anual: 2026 YTD com 10 meses; 2023 (início incompleto) continua de fora', [PAp.map(p => p.label), PAp[2].months, PAp[2].a, PAp[2].b], [['2024', '2025', '2026 YTD'], 10, 26, 35]);
eq('LTM não existe no período parcial (o trimestre cheio anterior soma 4 × 3 meses)', C.aggregators(PQp, 4).ltm.sum(ax.map(() => 1)).slice(-2), [12, null]);
eq('mensal nunca tem parcial', C.buildPeriods(ax, 'monthly', true).length, 36);
eq('períodos por ano', [C.perYear('monthly'), C.perYear('quarterly'), C.perYear('annual')], [12, 4, 1]);

// ── janelas (mesmas regras da tela antiga, exceto o YTD) ──
const last = ax.length - 1;
eq('3M = do último mês para trás, com o mês de corte (4 pontos)', C.monthWindow(ax, last, { win: '3m' }), [32, 35]);
eq('1Y = 13 pontos (mesmo mês do ano anterior incluído)', C.monthWindow(ax, last, { win: '1y' }), [23, 35]);
eq('5Y maior que a série = série inteira', C.monthWindow(ax, last, { win: '5y' }), [0, 35]);
eq('All', C.monthWindow(ax, last, { win: 'all' }), [0, 35]);
eq('YTD = ano do ÚLTIMO DADO (não do relógio)', C.monthWindow(ax, last, { win: 'ytd' }), [26, 35]);
eq('YTD com o último dado em dezembro = o ano inteiro daquele dado', C.monthWindow(C.axis('2023-01', '2025-12'), 35, { win: 'ytd' }), [24, 35]);
eq('intervalo livre: de/até', C.monthWindow(ax, last, { win: 'custom', from: '2024-03', to: '2025-02' }), [4, 15]);
eq('intervalo livre: só "de"', C.monthWindow(ax, last, { win: 'custom', from: '2026-01', to: null }), [26, 35]);
eq('intervalo livre: fora da série não quebra', C.monthWindow(ax, last, { win: 'custom', from: '2030-01', to: '2031-01' }), [35, 35]);
eq('trimestres mostrados = os que TERMINAM na janela', C.periodWindow(PQ, 23, 35).map(i => PQ[i].label), ['4Q25', '3Q26']);
eq('anos mostrados na janela inteira', C.periodWindow(PA, 0, 35).map(i => PA[i].label), ['2024', '2025']);
eq('janela sem período completo cai no último período disponível', C.periodWindow(PA, 33, 35), [1, 1]);

// ── agregadores ──
const v = ax.map((_, i) => i + 1);                    // 1..36
const AQ = C.aggregators(PQ, 4), AM = C.aggregators(PM, 12), AA = C.aggregators(PA, 1);
eq('soma trimestral', AQ.level.sum(v).slice(0, 2), [3 + 4 + 5, 6 + 7 + 8]);
eq('último do trimestre', AQ.level.last(v).slice(0, 2), [5, 8]);
eq('soma anual', AA.level.sum(v), [(3 + 14) * 12 / 2, (15 + 26) * 12 / 2]);
const vn = v.slice(); vn[4] = null;
eq('mês faltando zera o trimestre (não soma pela metade)', AQ.level.sum(vn)[0], null);
eq('LTM mensal: soma de 12 meses, null antes', [AM.ltm.sum(v)[10], AM.ltm.sum(v)[11], AM.ltm.sum(v)[12]], [null, 78, 90]);
eq('LTM trimestral: 4 trimestres', AQ.ltm.sum(v)[3], 12 + 21 + 30 + 39);
near('LTM de série "último": média dos 12 meses', AM.ltm.last(v)[11], 6.5);
const F = C.F;
eq('razão: receita ÷ volume do período', F.div(AQ.level.sum(v.map(x => x * 2)), AQ.level.sum(v), 1000)[0], 2000);
eq('divisão por zero ou null = null', F.div([1, 2, null], [0, 4, 5]), [null, 0.5, null]);
eq('diferença com null', F.sub([5, null, 3], [1, 2, null]), [4, null, null]);

// ── variações, faixa e formatação ──
near('variação % entre períodos', C.change([100, 110], 1, 1), 10);
eq('variação em pp para percentuais', C.change([20.5, 23], 1, 1, { pp: true }), 2.5);
eq('variação sem base = null', C.change([0, 5], 1, 1), null);
eq('variação com buraco = null', C.change([null, 5], 1, 1), null);
const rg = C.rangeN([5, 1, 9, 4, 7], 4, 5);
eq('faixa de 5 anos: mínimo, máximo, posição e ranking', [rg.mn, rg.mx, rg.pos, rg.rank, rg.n], [1, 9, 0.75, 2, 5]);
eq('faixa ignora buracos', C.rangeN([null, 2, null, 6], 3, 60).n, 2);
eq('último índice com dado', [C.lastIdx([1, 2, null]), C.lastIdx([null, null])], [1, -1]);
eq('milhar com vírgula (en-US) e traço no vazio', [C.fmt(1234567.8, 0), C.fmt(12.345, 1), C.fmt(null, 0)], ['1,234,568', '12.3', '—']);
eq('texto de variação: %, pp e diferença', [C.chgTxt({}, 12.34), C.chgTxt({ pp: true }, -1.26), C.chgTxt({ diff: true, dec: 0 }, 79.4), C.chgTxt({}, null)], ['+12.3%', '−1.3 pp', '+79', '—']);

// ── BUILDER (data-desk-builder.js): catálogo de mentira, sem tela — as contas e os limites ──
(function () {
  const B = IBBADesk.builder, mo = [];   // jan/2024 → out/2026 (34 meses)
  for (let y = 2024; y <= 2026; y++) for (let m = 1; m <= (y === 2026 ? 10 : 12); m++) mo.push(y + '-' + String(m).padStart(2, '0'));
  const mk = f => { const o = {}; mo.forEach((k, i) => { o[k] = f(i); }); return o; };
  const MA = mk(i => 100 + i), MB = mk(i => 10 + i), MR = mk(i => (100 + i) * 5), MS = mk(i => i - 5), MW = mk(i => 20 + i / 10), MC = mk(i => 40 + i), MK = mk(i => 7);
  let ST = { prod: 'total', gran: 'monthly', win: 'ytd', from: null, to: null };
  try { localStorage.removeItem('ibba_desk_builder_t'); localStorage.removeItem('ibba_desk_views_t'); } catch (e) {}
  const D2 = IBBADesk.mount({ sector: 't', root: null, state: () => ST, sections: {
    a: { label: 'A', src: 'SRC', stage: 'v', tiles: ['v'], bprods: [{ k: 'total', l: 'Total' }, { k: 'x', l: 'Flat' }], metrics: [
      { id: 'v', label: 'Volume', unit: 'kt', dec: 0, flow: true, comp: x => ({ v: x.prod === 'total' ? MA : MB }), calc: (A, c) => A.sum(c.v) },
      { id: 'p', label: 'Price', unit: 'US$/t', dec: 0, comp: () => ({ r: MR, v: MA }), calc: (A, c) => F.div(A.sum(c.r), A.sum(c.v)) },
      { id: 's', label: 'Spread', unit: 'US$/t', dec: 0, diff: true, comp: () => ({ v: MS }), calc: (A, c) => A.last(c.v) },
      { id: 'w', label: 'Share', unit: '%', dec: 1, pp: true, comp: () => ({ v: MW }), calc: (A, c) => A.last(c.v) },
      { id: 'two', label: 'Both', multi: ['v', 'p'] },
      { id: 'only', label: 'Only total', unit: 'kt', bprods: ['total'], comp: () => ({ v: MA }), calc: (A, c) => A.sum(c.v) }],
      who: [{ id: 'c', label: 'Countries', title: 'A by country', unit: 'kt', entities: () => ({ names: ['China', 'Korea~South'], maps: [MC, MK] }) }] },
    fx: { label: 'Fixed', fixed: { gran: 'monthly' }, stage: 'v', tiles: [], metrics: [{ id: 'v', label: 'V', unit: 'kt', comp: () => ({ v: MA }), calc: (A, c) => A.sum(c.v) }] },
    builder: { label: 'Builder', builder: true, order: ['a', 'fx'], presets: [{ n: 'P', s: ['a.v.total', 'a.p.total'], v: 'level' }] } } });
  eq('Builder · chave de indicador', B.parseKey('a.v.total'), { type: 'm', sec: 'a', metric: 'v', prod: 'total' });
  eq('Builder · chave de entidade (nome com ~)', B.parseKey('a~c~total~Korea~South'), { type: 'e', sec: 'a', dim: 'c', prod: 'total', name: 'Korea~South' });
  const V0 = { s: ['a.v.total', 'a~c~total~Côte d\'Ivoire; (x)!'], v: 'ltm', g: 'quarterly', w: 'custom', from: '2024-03', to: '2026-06' };
  eq('Builder · a visão vai e volta pelo link sem perder nada', B.decodeView(B.encodeView(V0)), V0);
  eq('Builder · link vazio = nada', B.decodeView(''), null);
  const b0 = D2._bState();
  eq('Builder · abre com a 1ª visão pronta', [b0.s.map(x => x.key), b0.calc], [['a.v.total', 'a.p.total'], 'level']);
  eq('Builder · nome ganha o produto só fora do 1º produto', [D2._bItem('a.v.total').name, D2._bItem('a.v.x').name, D2._bItem('a~c~total~China').name], ['Volume', 'Volume · Flat', 'China — A by country']);
  eq('Builder · composto, seção fixa, produto que não vale e chave torta ficam fora do catálogo', [D2._bItem('a.two.total'), D2._bItem('fx.v.total'), D2._bItem('a.only.x'), D2._bItem('a.nope.total'), D2._bItem('zzz')], [null, null, null, null, null]);
  eq('Builder · catálogo sai das seções (a fixa não entra)', D2._bGroups().map(g => g.id), ['a']);
  let v = D2._bView();
  eq('Builder · unidades diferentes = BASE 100 num gráfico só (não um painel por unidade)', [v.panels.map(p => [p.unit, p.rows.length]), v.calc, v.want, v.auto, v.units], [[['Index', 2]], 'index', 'level', true, ['kt', 'US$/t']]);
  eq('Builder · janela YTD mensal = jan a out do último ano', [v.P[v.i0].key, v.P[v.i1].key, v.i1 - v.i0 + 1], ['2026-01', '2026-10', 10]);
  eq('Builder · base 100 no começo da janela; o nível de verdade fica guardado para a ficha', [v.rows[0].v[v.i0], v.rows[1].v[v.i0], v.rows[0].lev[v.i1], v.rows[1].lev[v.i1]], [100, 100, 133, 5]);
  eq('Builder · YoY de volume e de preço é % nos dois: essa conta não precisa de base 100', v.mixed, { level: true, yoy: false, ltm: true });
  eq('Builder · outra unidade ainda cabe (vai para a base 100)', D2._bWhy('a.w.total'), null);
  eq('Builder · spread (pode ser negativo) não entra junto de outras unidades, com o motivo', /cannot go on base 100/.test(D2._bWhy('a.s.total')), true);
  D2._bApply({ s: ['a.v.total', 'a.v.x'], v: 'level' }, false); v = D2._bView();
  eq('Builder · mesma unidade = Level de verdade, um painel', [v.panels.map(p => [p.unit, p.rows.length]), v.calc, v.auto, v.rows[0].v[v.i1], v.rows[1].v[v.i1]], [[['kt', 2]], 'level', false, 133, 43]);
  D2._bApply({ s: ['a.p.total', 'a.s.total'], v: 'level' }, false);
  eq('Builder · spread entra com série da mesma unidade; e trava a mistura de unidades enquanto estiver lá', [D2._bView().auto, D2._bView().panels.length, /remove it to mix units/.test(D2._bWhy('a.v.total'))], [false, 1, true]);
  D2._bApply({ s: ['a.v.total', 'a.v.x', 'a~c~total~China', 'a.only.total'], v: 'level' }, false);
  eq('Builder · limite de 4 séries, com o motivo', [D2.bui.s.length, /Up to 4 series/.test(D2._bWhy('a.p.total'))], [4, true]);
  eq('Builder · cada série com a sua cor', D2.bui.s.map(x => x.col), [0, 1, 2, 3]);
  D2.bui.s.splice(1, 1); D2.bui.s.push({ key: 'a.p.total', col: D2._bFree() });
  eq('Builder · a série que entra pega a cor que ficou livre (as outras não mudam)', D2.bui.s.map(x => x.col), [0, 2, 3, 1]);
  D2._bApply({ s: ['a.v.total', 'a.p.total'], v: 'yoy' }, false); v = D2._bView();
  eq('Builder · YoY: volume e preço em % no mesmo gráfico', [v.rows.map(r => r.unit), v.panels.length, v.auto], [['%', '%'], 1, false]);
  near('Builder · YoY do volume', v.rows[0].v[v.i1], (133 / 121 - 1) * 100);
  D2._bApply({ s: ['a.v.total', 'a.w.total'], v: 'yoy' }, false); v = D2._bView();
  eq('Builder · YoY em % e em pp não se comparam: base 100', [v.calc, v.auto, v.units, v.panels.length], ['index', true, ['%', 'pp'], 1]);
  D2._bApply({ s: ['a.v.total', 'a.p.total', 'a.s.total', 'a.w.total'], v: 'index' }, false); ST = Object.assign({}, ST, { win: '1y' }); v = D2._bView();
  eq('Builder · Index: um painel só, mesmo com 3 unidades', v.panels.map(p => p.unit), ['Index']);
  eq('Builder · Index começa em 100', [v.rows[0].v[v.i0], v.rows[1].v[v.i0]], [100, 100]);
  near('Builder · Index segue nível ÷ base × 100', v.rows[0].v[v.i1], 133 / 121 * 100);
  eq('Builder · spread (pode ser negativo) não entra no Index, com aviso', [v.rows[2].v.every(x => x == null), /cannot be indexed/.test(v.rows[2].note)], [true, true]);
  eq('Builder · no Index o limite de unidades não vale', D2._bWhy('a.w.total'), null);
  ST = { prod: 'total', gran: 'quarterly', win: 'all', from: null, to: null }; D2._bApply({ s: ['a.v.total'], v: 'level' }, false); v = D2._bView();
  eq('Builder · trimestre: só os completos (4T26 em andamento fica de fora)', [v.P[v.i1].key, v.P.length], ['2026-Q3', 11]);
  eq('Builder · soma do trimestre', v.rows[0].v[v.i1], 130 + 131 + 132);
  const sa = D2.seriesAll('a', { metric: 'v' }, 'total', 'quarterly');
  eq('seriesAll · mesmo caminho do palco: o último trimestre vem marcado como parcial', [sa.keys[sa.keys.length - 1], sa.partial[sa.partial.length - 1], sa.level[sa.level.length - 1]], ['2026-Q4', true, 133]);
  const se = D2.seriesAll('a', { dim: 'c', name: 'China' }, 'total', 'annual');
  eq('seriesAll · entidade: soma do ano e YoY', [se.level[0], se.level[1], +se.yoy[1].toFixed(4)], [12 * 40 + 66, 12 * 52 + 66, +(((12 * 52 + 66) / (12 * 40 + 66) - 1) * 100).toFixed(4)]);
  ST = { prod: 'total', gran: 'annual', win: 'all', from: null, to: null }; D2._bApply({ s: ['a.v.total'], v: 'ltm' }, false); v = D2._bView();
  eq('Builder · LTM não existe no anual: volta para Level', [D2.bui.calc, v.P.map(p => p.key)], ['level', ['2024', '2025']]);
  eq('Builder · a última visão fica guardada neste navegador', JSON.parse(localStorage.getItem('ibba_desk_builder_t')).s, ['a.v.total']);
})();

/* ── PREÇOS (data-desk-prices.js): as contas puras das seções de preço. Números FICTÍCIOS (o repositório é público). ── */
(function () {
  const X = IBBADesk.prices;
  const r = X.parity({ week: '2030-01-04', fob: 500, freight: 100, insurance: 0.01, tariff: 0.10, afrmm: 0.20, port: 30, dom_brl: 4000, fx: 5 });
  near('Paridade · CIF = (FOB + frete) × (1 + seguro)', r.cif, 606, 1e-9);
  near('Paridade · importado = CIF + tarifa + AFRMM + porto', r.imported, 716.6, 1e-9);
  near('Paridade · doméstico em US$ = R$/t ÷ câmbio', r.domUsd, 800, 1e-9);
  near('Paridade · prêmio = doméstico ÷ importado − 1, em %', r.premium, (800 / 716.6 - 1) * 100, 1e-9);
  near('Paridade · prêmio sem a tarifa de importação', r.premiumZero, (800 / 656 - 1) * 100, 1e-9);
  eq('Paridade · sem câmbio não há prêmio (e a conta do importado continua)', [X.parity({ fob: 500, freight: 100, insurance: 0, tariff: 0, afrmm: 0, port: 0, dom_brl: 4000, fx: null }).premium, X.parity({ fob: 500, freight: 100, insurance: 0, tariff: 0, afrmm: 0, port: 0, dom_brl: null, fx: 5 }).imported], [null, 600]);
  eq('fromDaily · um ponto por dia (o último da lista), em ordem, sem vazios', X.fromDaily([[1893456000 + 86400, 12], [1893456000, 10], [1893456000 + 3600, 11], [1893456000 + 2 * 86400, null]]), [['2030-01-01', 11], ['2030-01-02', 12]]);
  eq('combine · conta só nos dias em que as duas séries têm valor', X.combine([['a', 10], ['b', 20], ['c', 30]], [['b', 5], ['c', 6], ['d', 7]], (x, y) => x - y), [['b', 15], ['c', 24]]);
  eq('at · último ponto em ou antes da data', [X.at([['2030-01-01', 1], ['2030-01-05', 2]], '2030-01-04'), X.at([['2030-01-01', 1]], '2029-12-31')], [['2030-01-01', 1], null]);
  eq('shift · meses para trás e para a frente, com fim de mês', [X.shift('2030-03-31', -1), X.shift('2030-01-15', -12), X.shift('2030-11-30', 3)], ['2030-02-28', '2029-01-15', '2031-02-28']);
  const dates = ['2029-06-01', '2029-12-28', '2030-01-04', '2030-02-01', '2030-03-01'];
  eq('janela · YTD, 3M, All e datas livres (os mesmos botões da página)', [X.win(dates, { win: 'ytd' }), X.win(dates, { win: '3m' }), X.win(dates, { win: 'all' }), X.win(dates, { win: 'custom', from: '2029-12', to: '2030-01' })], [[2, 4], [1, 4], [0, 4], [1, 2]]);
  const al = X.align([[['a', 1], ['c', 3]], [['b', 20], ['c', 30]]]);
  eq('align · um eixo com a união das datas; vazio onde a série não tem valor', [al.dates, al.vals], [['a', 'b', 'c'], [[1, null, 3], [null, 20, 30]]]);
  const last = { week: '2030-01-04', fob: 500, freight: 100, insurance: 0.01, tariff: 0.1, afrmm: 0.2, port: 30, dom_brl: 4000, fx: 5 };
  eq('ao vivo · só existe com preço DEPOIS da última semana gravada e com câmbio', [X.liveRow(last, [['2030-01-04', 500]], [], 5.2), X.liveRow(last, [['2030-01-08', 510]], [['2030-01-07', 4100]], 0)], [null, null]);
  const lv = X.liveRow(last, [['2030-01-04', 500], ['2030-01-08', 510]], [['2030-01-07', 4100]], 5.2);
  eq('ao vivo · preço e câmbio de hoje; frete, tarifa, AFRMM e porto da última semana', [lv.week, lv.fob, lv.dom_brl, lv.fx, lv.freight, lv.tariff, lv.live], ['2030-01-08', 510, 4100, 5.2, 100, 0.1, true]);
  const S = { daily: { F: { pts: [['2030-01-04', 500], ['2030-01-08', 510]] }, DM: { pts: [['2030-01-07', 4100]] } }, fx: 5.2, v: 1, parCodes: { hrc: { fob: 'F', dom: 'DM' } },
    parity: { hrc: [['2029-12-28', 480, 100, 0.01, 0.1, 0.2, 30, 3900, 5], ['2030-01-04', 500, 100, 0.01, 0.1, 0.2, 30, 4000, 5]] } };
  const rows = X.P.par(S, 'hrc');
  eq('P.par · semanas gravadas + o ponto ao vivo no fim', [rows.length, rows[1].live, rows[2].live, rows[2].week], [3, false, true, '2030-01-08']);
  near('P.par · a conta do ponto ao vivo', rows[2].premium, ((4100 / 5.2) / ((510 + 100) * 1.01 * 1.1 + 20 + 30) - 1) * 100, 1e-9);
  eq('P.col / P.rowAt', [X.P.col(rows, 'fob'), X.P.rowAt(rows, '2030-01-06').week, X.P.rowAt(rows, '2029-01-01')], [[['2029-12-28', 480], ['2030-01-04', 500], ['2030-01-08', 510]], '2030-01-04', null]);

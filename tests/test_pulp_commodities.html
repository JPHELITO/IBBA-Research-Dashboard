<!doctype html><meta charset="utf-8"><title>celulose (Fastmarkets PIX) — grupos e cartões</title>
<body><pre id="out">rodando…</pre><script>
/* Tira do próprio index.html o mapa de frequência, os grupos do carrossel e o
   desenhador do cartão, e confere que as 6 commodities de celulose da Fastmarkets
   entram certas. Os `code` daqui são contrato com o robô (news-hunter:
   FASTMARKETS_COMMODITIES) — se um lado renomear, o cartão some calado. */
const R=[], ok=(n,c,d='')=>R.push((c?'PASS':'FAIL')+' · '+n+(d?'  ['+d+']':''));
function cut(t,a,b){const i=t.indexOf(a),j=t.indexOf(b,i); if(i<0||j<0)throw new Error('trecho: '+a); return t.slice(i,j+b.length);}

const PULP = ['PULP_NBSK_CHINA','PULP_BHKP_CHINA','PULP_EUCA_RESALE_CN',
              'PULP_RADIATA_RESALE_CN','PULP_NBSK_EUROPE','PULP_BHKP_EUROPE'];

window.__RUN__=async function(){
  // index.html está gravado em CRLF e as âncoras abaixo usam \n → normaliza antes de recortar
  const cru = await (await fetch('/index.html?v='+Date.now())).text();
  const t = cru.split('\r\n').join('\n');
  const FREQ  = cut(t,'const FREQ_LIVE   = new Set(',"  return 'Daily';\n}");
  const DATA  = cut(t,'function _fmtAssessed(iso, freq){',"month:'short'});\n}");
  const GRUPOS= cut(t,'let COMM_GROUPS = [','];');
  const SPARK = cut(t,'function _commSpark(sp, b, classe){','</svg>`;\n}');
  // ⚠️ o fim tem de citar o ${corpo}: `_cmRow` também acaba em "</div>`;\n}"
  const CARD  = cut(t,'function _pctCurto(v){','    ${corpo}\n  </div>`;\n}');
  const LABEL = cut(t,'const PERIOD_ROWS = ',"['y','1Y']];");

  const ctx={NUM_LOC:'en-US', Math, Array, Date, Object, Number};
  const M=new Function('ctx',`with(ctx){ ${FREQ}\n${DATA}\n${GRUPOS}\n${LABEL}\n${SPARK}\n${CARD}
    return {_freqOf, COMM_GROUPS, _kvCard, FREQ_WEEKLY, _fmtAssessed}; }`)(ctx);

  // ── 1. frequência: assessment PIX é semanal, e o badge tem que dizer isso
  ok('as 6 de celulose são Weekly',
     PULP.every(code=>M._freqOf({code})==='Weekly'),
     PULP.filter(code=>M._freqOf({code})!=='Weekly').join(',')||'todas ok');
  ok('não estraguei o Pellet Premium (o semanal que já existia)',
     M._freqOf({code:'IOBFC04'})==='Weekly');
  ok('minério segue Daily e cobre segue Live',
     M._freqOf({code:'IRON_ORE'})==='Daily' && M._freqOf({code:'COPPER'})==='Live');

  // ── 2. grupos do carrossel (o default; o admin pode sobrescrever pelo Supabase)
  const g = Object.fromEntries(M.COMM_GROUPS.map(x=>[x.title, x.codes]));
  // ORDEM importa: Net e Resale da mesma fibra lado a lado, BHKP primeiro (pedido do analista)
  ok('grupo "Pulp China (PIX)" na ordem BHKP Net, NBSK Net, BHKP Resale, NBSK Resale',
     JSON.stringify(g['Pulp China (PIX)'])===JSON.stringify(
       ['PULP_BHKP_CHINA','PULP_NBSK_CHINA','PULP_EUCA_RESALE_CN','PULP_RADIATA_RESALE_CN']),
     JSON.stringify(g['Pulp China (PIX)']));
  ok('grupo "Pulp Europe (PIX)": só as duas em US$ (as em EUR ficam de fora), BHKP primeiro',
     JSON.stringify(g['Pulp Europe (PIX)'])===JSON.stringify(
       ['PULP_BHKP_EUROPE','PULP_NBSK_EUROPE']),
     JSON.stringify(g['Pulp Europe (PIX)']));
  ok('os 6 códigos aparecem em algum grupo, sem repetir',
     (()=>{const todos=M.COMM_GROUPS.flatMap(x=>x.codes).filter(c=>PULP.includes(c));
           return todos.length===6 && new Set(todos).size===6;})());
  ok('os 5 grupos de aço/minério continuam lá', M.COMM_GROUPS.length===7,
     'grupos='+M.COMM_GROUPS.length);
  // 6 cartões numa fileira cortam o nome ("Euca Resal…"): a régua é 5, como os grupos antigos
  ok('nenhum grupo passa de 5 cartões',
     M.COMM_GROUPS.every(x=>x.codes.length<=5),
     M.COMM_GROUPS.filter(x=>x.codes.length>5).map(x=>x.title).join(',')||'ok');

  // ── 3. o cartão desenhado
  // O resale chega da Fastmarkets em YUAN e o robô publica em DÓLAR (a conta da planilha
  // do analista, hunter/prices.py::resale_cny_para_usd) — o cartão nunca mostra yuan.
  // ⚠️ `change_pct` = 0 de propósito: é o valor REAL destas 6 quatro dias em cinco, porque
  // o assessment PIX é semanal. Foi o que motivou a regra nova (2026-08-31): numa Weekly o
  // número grande do cartão é o WoW, não o do dia. Com change_pct ≠ w.c o teste discrimina.
  const janelas=(w,m,ytd,y)=>({d:{c:0,s:[500,500,500],b:1}, w:{c:w,s:[100,400,900],b:1},
    m:{c:m,s:[200,500,800],b:1}, ytd:{c:ytd,s:[300,600,900],b:0}, y:{c:y,s:[100,500,900],b:0}});
  const euca={code:'PULP_EUCA_RESALE_CN', name:'BHKP China Resale', unit:'USD/t',
              price:576.01, change_pct:0, assessed_at:new Date().toISOString().slice(0,10),
              spark:janelas(3.11, 5.00, 1.88, 15.38)};
  const html=M._kvCard(euca);
  ok('o resale sai em dólar, com 2 casas', html.includes('576.01'), html.slice(0,200));
  ok('a unidade é USD/t (nunca CNY/t)', html.includes('USD/t') && !html.includes('CNY'));
  ok('numa Weekly o número grande é o WoW (em dólar), não o "+0,00%" do dia',
     html.includes('+3.11%') && !html.includes('+0.00%'),
     (html.match(/<span class="cm-chg">([^<]*)</)||[])[1]);
  ok('sobe = cartão verde', html.includes('cm-card up'));
  ok('o badge Weekly entra no cartão', html.includes('kv-badge wk')&&html.includes('Weekly'));
  ok('as 4 linhas de período são desenhadas',
     (html.match(/class="cm-row /g)||[]).length===4 && html.includes('<svg class="cm-rs"'),
     'linhas='+((html.match(/class="cm-row /g)||[]).length));
  ok('o "d" não vira linha (a variação do dia é o número grande)',
     !/>D</.test(html) && html.includes('>W<'));

  const nbsk={code:'PULP_NBSK_EUROPE', name:'NBSK Europe', unit:'USD/t', price:1629.77,
              change_pct:0, assessed_at:'2026-08-25', spark:janelas(-0.18, -1.24, 8.77, 8.97)};
  const h2=M._kvCard(nbsk);
  ok('preço de 4 dígitos com casas decimais', h2.includes('1,629.77'), h2.slice(0,200));
  ok('cai = cartão vermelho e sinal negativo', h2.includes('cm-card down')&&h2.includes('-0.18%'));
  ok('cada linha tem a SUA cor (a semana cai, o ano sobe no mesmo cartão)',
     h2.includes('cm-row down')&&h2.includes('cm-row up'));

  document.getElementById('out').textContent =
    R.join('\n')+'\n\n'+R.filter(x=>x.startsWith('PASS')).length+'/'+R.length+' OK';
  return R;
};
__RUN__().catch(e=>{document.getElementById('out').textContent='ERRO: '+e.message;});
</script>

name: 🔄 Auto-Update Korea (linha preta) — data.go.kr

# Coreia consolida o mês ~dia 15 → checa nos dias 13–25. Também manual.
# DORMENTE: Coreia segue MANUAL por ora (sem contato coreano p/ criar a chave grátis
# data.go.kr). Este workflow só roda no DISPARO MANUAL. Quando houver a chave: adicionar
# o secret KOREA_SERVICE_KEY e descomentar o cron abaixo p/ ligar o automático.
on:
  workflow_dispatch:
    inputs:
      backfill:
        description: "Recarregar histórico da Coreia (rodar 1x; requer KOREA_SERVICE_KEY)"
        required: false
        default: "false"
  # schedule:
  #   - cron: "0 12 13-25 * *"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Steel and Mining/requirements.txt"

      - name: Install dependencies
        run: pip install -r "Steel and Mining/requirements.txt"

      - name: Update Korea (data.go.kr getNitemtradeList)
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python "Steel and Mining/update_korea.py" --backfill
          else
            python "Steel and Mining/update_korea.py" --update
          fi
        env:
          KOREA_SERVICE_KEY: ${{ secrets.KOREA_SERVICE_KEY }}

      - name: DB size gate (<50 MB p/ sql.js)
        run: python _shared/check_db_size.py "Steel and Mining/steel_sm.db"

      - name: Send email notification
        if: env.KOREA_NEW_DATA == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port:    587
          secure:         false
          username:       ${{ secrets.SMTP_USER }}
          password:       ${{ secrets.SMTP_PASS }}
          to:             jphelito@gmail.com,joao.helito@itaubba.com
          from:           "IBBA Dashboard <${{ secrets.SMTP_USER }}>"
          subject:        "🔔 Linha preta (Coreia) — novo dado: ${{ env.KOREA_LATEST }}"
          body: |
            A linha preta (exportações de aço da Coreia → Brasil, SH6 antidumping) foi
            atualizada automaticamente via API oficial da Aduana Coreana (data.go.kr).

            📅 Novo período: ${{ env.KOREA_LATEST }}
            ---
            Itaú BBA — Equity Research | Steel & Mining (mensagem automática)

      # Regera o banco WEB (o que o cliente baixa). SEM isto o steel_sm.db anda e o
      # steel_sm_web.db.gz fica para trás → cliente vendo dado velho.
      - name: Build web DB (slim + gzip)
        if: env.KOREA_NEW_DATA == 'true' || github.event.inputs.backfill == 'true'
        run: python "Steel and Mining/build_web_db.py"

      - name: Commit & push updated DB
        if: env.KOREA_NEW_DATA == 'true' || github.event.inputs.backfill == 'true'
        run: |
          git config user.name  "IBBA Bot"
          git config user.email "bot@itaubba.com"
          git add "Steel and Mining/steel_sm.db" "Steel and Mining/steel_sm_web.db.gz"
          if git diff --staged --quiet; then
            echo "::warning::sem mudança no .db — nada a commitar."
          else
            git commit -m "data: linha preta Coreia (pred_exports) -> ${KOREA_LATEST}"
            git pull --rebase --autostash || true
            git push
            echo "✅ pred_exports[Korea] commitado -> ${KOREA_LATEST}"
          fi

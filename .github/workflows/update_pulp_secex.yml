name: 🔄 Auto-Update Celulose por Porto e País (SECEX ao vivo) — MDIC

# SECEX publica ~4º dia útil → checa dias 1–12. Também manual.
on:
  schedule:
    - cron: "0 13 1-12 * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Recarregar celulose de --start-year (2015) até hoje (rodar 1x)"
        required: false
        default: "false"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Pulp and Paper/requirements.txt"

      - name: Install dependencies
        run: pip install -r "Pulp and Paper/requirements.txt"

      # --update: meses novos por porto + janela de revisão (ano corrente + anterior) por país
      - name: Update celulose por porto e país (MDIC ao vivo)
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python "Pulp and Paper/update_pulp_secex.py" --backfill
          else
            python "Pulp and Paper/update_pulp_secex.py" --update
          fi

      - name: DB size gate (<50 MB p/ sql.js)
        run: python _shared/check_db_size.py "Pulp and Paper/pulp_paper.db"

      - name: Commit & push updated DB
        if: env.PULP_NEW_DATA == 'true' || github.event.inputs.backfill == 'true'
        run: |
          git config user.name  "IBBA Bot"
          git config user.email "bot@itaubba.com"
          git add "Pulp and Paper/pulp_paper.db"
          if git diff --staged --quiet; then
            echo "::warning::sem mudança no .db — nada a commitar."
          else
            git commit -m "data: celulose por porto e país (secex_pulp_port/country) -> ${PULP_LATEST}"
            git pull --rebase --autostash || true
            git push
            echo "✅ secex_pulp_port commitado -> ${PULP_LATEST}"
          fi

      - name: Log auto-update (painel admin)
        if: env.PULP_NEW_DATA == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python _shared/log_update.py "Celulose" auto "cron MDIC ${PULP_LATEST}"

      # ── AVISO POR E-MAIL — POR ÚLTIMO, DE PROPÓSITO ───────────────────────
      # 2026-09-08: este passo ficava ANTES do commit. Com a senha de app do
      # Gmail vencida ele falhava (535 BadCredentials), o job morria ali e o
      # "Commit & push" era PULADO → o dado de agosto/2026 existia no runner e
      # nunca chegou na dashboard. Agora o dado é gravado primeiro e o e-mail
      # vem depois: se o SMTP estiver morto o job fica VERMELHO (o alarme
      # continua), mas a base já subiu.
      # 2026-11-03 (pedido do usuário): o TIME só recebe quando sai MÊS NOVO (--team); rodada só
      # de revisão vai só para o João. notify.py no lugar do action-send-mail: lista do time num
      # lugar só (registry.py) e porta 465 de reserva. --require = job VERMELHO se não sair.
      - name: Send email notification
        if: env.PULP_NEW_DATA == 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          PARA=""
          if [ -n "$PULP_NEW_MONTH" ]; then PARA="--team"; fi
          cat > "$RUNNER_TEMP/pulp_mail.txt" <<FIM
          A exportação de celulose por porto e por país (SECEX/MDIC ao vivo) foi atualizada
          automaticamente no dashboard de Pulp & Paper.

          📅 Novo período: ${PULP_LATEST}
          ---
          Itaú BBA — Equity Research | Pulp & Paper (mensagem automática)
          FIM
          python _shared/notify.py $PARA --require \
            --subject "🔔 Celulose por porto e país (SECEX) — atualizado: ${PULP_LATEST}" \
            --body-file "$RUNNER_TEMP/pulp_mail.txt"

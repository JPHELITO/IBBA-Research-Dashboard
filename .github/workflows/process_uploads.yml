name: Process Admin Uploads

# Processa os arquivos que o admin sobe pelo painel (fila upload_jobs no Supabase):
# baixa do Storage -> roda o processador (ex.: reload_pred_exports) -> commita o .db.
on:
  workflow_dispatch:            # "Run workflow" = processa na hora
  schedule:
    - cron: '*/15 * * * *'      # rede de segurança: a cada 15 min varre a fila

concurrency:
  group: process-uploads
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # <- FALTAVA: sem isto o git push dá 403 (token só-leitura)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pandas openpyxl

      - name: Process pending uploads
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python _shared/process_uploads.py

      # Regera o banco WEB (o que o cliente baixa). SEM isto o steel_sm.db anda e o
      # steel_sm_web.db.gz fica para trás → cliente vendo dado velho.
      - name: Build web DB (slim + gzip)
        if: env.UPLOADS_CHANGED == 'true'
        run: python "Steel and Mining/build_web_db.py"

      - name: Commit DB if changed
        if: env.UPLOADS_CHANGED == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Steel and Mining/steel_sm.db" "Steel and Mining/steel_sm_web.db.gz" "Pulp and Paper/pulp_paper.db"
          git diff --staged --quiet || git commit -m "data: upload do admin processado"
          git pull --rebase --autostash || true   # robustez contra corrida de push (igual ao pulp)
          git push

name: 🔄 Auto-Update IBÁ (papel) — visão (Gemini)

# DE HORA EM HORA, todo dia (o IBÁ publica 1×/mês, entre os dias 7-13; checar é barato,
# só um GET de texto — o Gemini só é chamado quando há mês novo). Fluxo:
# detecta mês novo → e-mail "saiu o dado" → Gemini lê (escalando modelo se preciso) →
# 3 checksums → se BATER: grava, commita, e-mail "base atualizada"; se NÃO: e-mail
# "precisa de conferência". Anti-spam: cada e-mail sai 1×/mês (dedup no update_log).
#
# ⚠️ Requer os secrets neste repo: GEMINI_API_KEY, SMTP_USER, SMTP_PASS,
#    SUPABASE_URL, SUPABASE_SERVICE_KEY.

on:
  schedule:
    - cron: "17 * * * *"   # de hora em hora (offset :17 p/ fugir da congestão de :00)
  workflow_dispatch:

concurrency:
  group: update-iba
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SMTP_USER:            ${{ secrets.SMTP_USER }}
      SMTP_PASS:            ${{ secrets.SMTP_PASS }}
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests pymupdf

      # Detecta, lê por visão, confere e grava. Manda os e-mails "saiu o dado" (detecção),
      # "precisa de conferência" (checksum falhou) e "não publicou" (atraso da fonte).
      - name: Ler/conferir/gravar (visão + checksums + e-mails de detecção/erro)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python "Pulp and Paper/update_iba_auto.py" --update

      # Publicou (checksums bateram) → commit
      - name: Commit pulp_paper.db
        if: env.IBA_NEW_DATA == 'true'
        run: |
          git config user.name  "IBBA Bot"
          git config user.email "bot@itaubba.com"
          git add "Pulp and Paper/pulp_paper.db"
          if git diff --staged --quiet; then
            echo "::warning::sem mudança no .db"
          else
            git commit -m "data: IBÁ papel (visão ${IBA_MODEL}) -> ${IBA_LATEST}"
            git pull --rebase --autostash || true
            git push
          fi

      # Só DEPOIS do commit → e-mail "base atualizada" (dedup 1×/mês)
      - name: E-mail — base atualizada
        if: env.IBA_NEW_DATA == 'true'
        run: |
          python _shared/notify.py --source iba_paper --period "${IBA_LATEST}" --kind updated \
            --subject "✅ IBÁ ${IBA_LATEST} publicado no dashboard" \
            --body "O boletim DadosPapel de ${IBA_LATEST} foi lido por visão (${IBA_MODEL}), passou nos 3 checksums e já está publicado no dashboard. https://metals-mining-pulp-paper-dashboard.vercel.app"

      - name: Log update
        if: env.IBA_NEW_DATA == 'true'
        run: python _shared/log_update.py "iba_paper" auto "visão ${IBA_MODEL} ${IBA_LATEST}"

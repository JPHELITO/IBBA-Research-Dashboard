name: 🔄 Auto-Update SECEX Steel & Mining

# Roda todos os dias 1–10 de cada mês (SECEX publica ~4º dia útil).
# O --update reconfere a JANELA inteira (ano corrente + anterior), não só o mês novo:
# o MDIC REVISA meses já publicados e o updater antigo descartava a revisão em silêncio.
#
# No dia 15 roda um --reconcile: não grava nada, só compara a dash com o MDIC e fica
# VERMELHO se divergir. É o alarme que faltava — sem ele, uma divergência (foi assim que
# o CRC importado ficou 14 meses subestimado) não aparece para ninguém.
on:
  schedule:
    - cron: "0 12 1-10 * *"   # 12h UTC todos os dias 1 a 10 de cada mês (atualiza)
    - cron: "30 12 15 * *"    # dia 15: só confere (não grava)
  workflow_dispatch:
    inputs:
      force:
        description: "Forçar recarga mesmo sem novidades"
        required: false
        default: "false"
      backfill_sh6:
        description: "Reconstruir quebras SH6×País/URF + linha laranja antidumping (rodar 1x; ~6 anos)"
        required: false
        default: "false"
      reconcile:
        description: "SÓ conferir a dash contra o MDIC (não grava nada; vermelho se divergir)"
        required: false
        default: "false"
      anos:
        description: "Janela de anos p/ --update/--reconcile (ex.: 2023 2024 2025 2026). Vazio = padrão"
        required: false
        default: ""

concurrency:
  group: steel-sm-db          # trava compartilhada com o update_iabr (ambos commitam steel_sm.db)
  cancel-in-progress: false

jobs:
  # ── Auditoria: compara a dash com o MDIC e SAI 1 se divergir. Não grava nada. ──
  # Roda no dia 15 (fora da janela de atualização) e no botão manual.
  reconcile:
    if: github.event.schedule == '30 12 15 * *' || github.event.inputs.reconcile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Steel and Mining/requirements.txt"
      - run: pip install -r "Steel and Mining/requirements.txt"
      - name: Conferir a dash contra o MDIC (não grava)
        env:
          PYTHONUTF8: "1"
        run: |
          ANOS=""
          if [ -n "${{ github.event.inputs.anos }}" ]; then ANOS="--anos ${{ github.event.inputs.anos }}"; fi
          python "Steel and Mining/updater_sm.py" --reconcile $ANOS

  update:
    if: github.event.schedule != '30 12 15 * *' && github.event.inputs.reconcile != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Steel and Mining/requirements.txt"

      - name: Install dependencies
        run: pip install -r "Steel and Mining/requirements.txt"

      # ── 3. Verificar e atualizar dados (incremental; também atualiza SH6×País/URF) ─
      - name: Check & update SECEX data
        id: update
        if: github.event.inputs.backfill_sh6 != 'true'
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          ANOS=""
          if [ -n "${{ github.event.inputs.anos }}" ]; then ANOS="--anos ${{ github.event.inputs.anos }}"; fi
          python "Steel and Mining/updater_sm.py" --update $FORCE_FLAG $ANOS
        # SEM env SMTP aqui de propósito: o updater_sm.py tem send_email() próprio que
        # dispara quando há SMTP_USER/PASS — isso causava DOIS e-mails de SECEX por mês
        # (um daqui + o do passo "Send email notification" abaixo). Sem as credenciais,
        # o send_email() interno cai no guard (linha ~701) e não envia → resta 1 e-mail.

      # ── 3a. Minério de ferro (mesma janela do SECEX → tabela secex_iron_ore) ──
      - name: Update iron ore (Fines/Pellets)
        if: github.event.inputs.backfill_sh6 != 'true'
        run: python "Steel and Mining/update_iron_ore.py" --update

      # (IABr saiu daqui: virou workflow próprio update_iabr.yml — sai na 2ª/3ª semana, não 1-10.)

      # ── 3b. (Manual, 1x) Histórico: SH6×País/URF + linha laranja + minério ────
      - name: Backfill (manual)
        if: github.event.inputs.backfill_sh6 == 'true'
        run: |
          python "Steel and Mining/updater_sm.py" --backfill-sh6
          python "Steel and Mining/update_iron_ore.py" --backfill

      # ── 4. Portão de tamanho: barra o commit se o .db estourar o limite do navegador ─
      - name: DB size gate (<50 MB p/ sql.js)
        run: python _shared/check_db_size.py "Steel and Mining/steel_sm.db"

      # ── 4b. Versão WEB do banco (o que o CLIENTE baixa) ──────────────────────
      # Só as 11 tabelas que a dashboard lê, comprimida: ~47 MB → ~10 MB.
      # O .db completo continua sendo a fonte da verdade (updater + console do admin).
      - name: Build web DB (slim + gzip)
        run: python "Steel and Mining/build_web_db.py"

      # ── 6. Commit e push do DB atualizado ───────────────────────────────────
      # NÃO usar git-auto-commit-action: o file_pattern sofre word-split e o
      # espaço em "Steel and Mining" faz o git não achar o arquivo →
      # "Working tree clean. Nothing to commit." (bug histórico). Commit manual
      # com o caminho entre aspas resolve.
      - name: Commit & push updated DB
        if: env.NEW_DATA == 'true' || env.IRON_NEW_DATA == 'true' || github.event.inputs.backfill_sh6 == 'true'
        run: |
          git config user.name  "IBBA Bot"
          git config user.email "bot@itaubba.com"
          git add "Steel and Mining/steel_sm.db" "Steel and Mining/steel_sm_web.db.gz"
          if git diff --staged --quiet; then
            echo "::warning::sem mudança no .db — nada a commitar."
          else
            if [ "${{ github.event.inputs.backfill_sh6 }}" = "true" ]; then
              MSG="data: popula secex_sh6_country/urf (quebras SH6xPais/URF) + dropa secex_port"
            else
              if [ -n "$NEW_MONTH" ]; then
                MSG="data: SECEX ${NEW_MONTH}"
                if [ -n "$REVISED" ]; then MSG="$MSG (+ revisoes: ${REVISED})"; fi
              else
                MSG="data: SECEX revisoes do MDIC -> ${REVISED}"
              fi
            fi
            git commit -m "$MSG"
            git pull --rebase --autostash || true
            git push
            echo "✅ steel_sm.db commitado e pushado"
          fi

      # ── 6b. Registra no painel admin (update_log) que rodou AUTOMÁTICO ────────
      - name: Log auto-update (painel admin)
        if: env.NEW_DATA == 'true' || env.IRON_NEW_DATA == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "$NEW_DATA" = "true" ]; then python _shared/log_update.py "SECEX" auto "cron MDIC ${LATEST_PERIOD}"; fi
          if [ "$IRON_NEW_DATA" = "true" ]; then python _shared/log_update.py "Minério" auto "cron MDIC"; fi

      # ── 7. Log final ────────────────────────────────────────────────────────
      - name: Summary
        run: |
          if [ "$NEW_DATA" = "true" ]; then
            echo "✅ Base atualizada até $LATEST_PERIOD — DB commitado."
            [ -n "$NEW_MONTH" ] && echo "   mês novo: $NEW_MONTH"
            [ -n "$REVISED" ]   && echo "   revisões do MDIC em meses já publicados: $REVISED"
          else
            echo "ℹ️  Nada mudou (nem mês novo, nem revisão). DB inalterado."
          fi

      # ── AVISO POR E-MAIL — POR ÚLTIMO, DE PROPÓSITO ───────────────────────
      # 2026-09-08: este passo ficava ANTES do commit. Com a senha de app do
      # Gmail vencida ele falhava (535 BadCredentials), o job morria ali e o
      # "Commit & push" era PULADO → o dado de agosto/2026 existia no runner e
      # nunca chegou na dashboard. Agora o dado é gravado primeiro e o e-mail
      # vem depois: se o SMTP estiver morto o job fica VERMELHO (o alarme
      # continua), mas a base já subiu.
      - name: Send email notification
        if: env.NEW_DATA == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port:    587
          secure:         false
          username:       ${{ secrets.SMTP_USER }}
          password:       ${{ secrets.SMTP_PASS }}
          to:             joao.helito@itaubba.com
          from:           "IBBA Dashboard <${{ secrets.SMTP_USER }}>"
          subject:        "🔔 SECEX Steel & Mining — base até ${{ env.LATEST_PERIOD }}"
          body: |
            Olá,

            A base SECEX (MDIC) do Steel & Mining foi atualizada.

            📅 Base agora vai até: ${{ env.LATEST_PERIOD }}
            🆕 Mês novo nesta rodada: ${{ env.NEW_MONTH }}
            ♻️ Revisões do MDIC em meses JÁ publicados: ${{ env.REVISED }}

            (o MDIC reajusta meses anteriores; quando isso acontece o número antigo
            é regravado, e é isso que a linha acima lista — período e quantos números
            mudaram. Vazio = nenhuma revisão nesta rodada.)

            📊 https://metals-mining-pulp-paper-dashboard.vercel.app/Steel%20and%20Mining/

            ---
            Itaú BBA — Equity Research | Steel & Mining
            (mensagem automática gerada pelo GitHub Actions)

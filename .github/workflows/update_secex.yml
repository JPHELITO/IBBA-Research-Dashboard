name: 🔄 Auto-Update SECEX Steel & Mining

# Roda todos os dias 1–10 de cada mês (SECEX publica ~4º dia útil)
# Também pode ser disparado manualmente
on:
  schedule:
    - cron: "0 12 1-10 * *"   # 12h UTC todos os dias 1 a 10 de cada mês
  workflow_dispatch:
    inputs:
      force:
        description: "Forçar recarga mesmo sem novidades"
        required: false
        default: "false"
      backfill_sh6:
        description: "Reconstruir quebras SH6×País/URF + linha laranja antidumping (rodar 1x; ~6 anos)"
        required: false
        default: "false"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Steel and Mining/requirements.txt"

      - name: Install dependencies
        run: pip install -r "Steel and Mining/requirements.txt"

      # ── 3. Verificar e atualizar dados (incremental; também atualiza SH6×País/URF) ─
      - name: Check & update SECEX data
        id: update
        if: github.event.inputs.backfill_sh6 != 'true'
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python "Steel and Mining/updater_sm.py" --update $FORCE_FLAG
        env:
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT:   587
          SMTP_USER:   ${{ secrets.SMTP_USER }}
          SMTP_PASS:   ${{ secrets.SMTP_PASS }}

      # ── 3a. Minério de ferro (mesma janela do SECEX → tabela secex_iron_ore) ──
      - name: Update iron ore (Fines/Pellets)
        if: github.event.inputs.backfill_sh6 != 'true'
        run: python "Steel and Mining/update_iron_ore.py" --update

      # ── 3a2. IABr (Aço Brasil) — Excel do site → tabelas iabr_* ───────────────
      - name: Update IABr (estatística mensal)
        if: github.event.inputs.backfill_sh6 != 'true'
        run: python "Steel and Mining/update_iabr.py" --update

      # ── 3b. (Manual, 1x) Histórico: SH6×País/URF + laranja + minério + IABr ───
      - name: Backfill (manual)
        if: github.event.inputs.backfill_sh6 == 'true'
        run: |
          python "Steel and Mining/updater_sm.py" --backfill-sh6
          python "Steel and Mining/update_iron_ore.py" --backfill
          python "Steel and Mining/update_iabr.py" --backfill

      # ── 4. Portão de tamanho: barra o commit se o .db estourar o limite do navegador ─
      - name: DB size gate (<50 MB p/ sql.js)
        run: python _shared/check_db_size.py "Steel and Mining/steel_sm.db"

      # ── 5. Enviar e-mail de notificação ─────────────────────────────────────
      - name: Send email notification
        if: env.NEW_DATA == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port:    587
          secure:         false
          username:       ${{ secrets.SMTP_USER }}
          password:       ${{ secrets.SMTP_PASS }}
          to:             jphelito@gmail.com,joao.helito@itaubba.com
          from:           "IBBA Dashboard <${{ secrets.SMTP_USER }}>"
          subject:        "🔔 SECEX Steel & Mining — novo dado: ${{ env.LATEST_PERIOD }}"
          body: |
            Olá,

            O SECEX (MDIC) publicou novos dados de comércio exterior de aço.

            📅 Novo período disponível: ${{ env.LATEST_PERIOD }}
            📊 Dashboard atualizado: https://ibba-research-dashboard.vercel.app/Steel%20and%20Mining/

            Os dados de importação e exportação por país e porto foram
            atualizados automaticamente no Steel & Mining Dashboard.

            ---
            Itaú BBA — Equity Research | Steel & Mining
            (mensagem automática gerada pelo GitHub Actions)

      # ── 6. Commit e push do DB atualizado ───────────────────────────────────
      # NÃO usar git-auto-commit-action: o file_pattern sofre word-split e o
      # espaço em "Steel and Mining" faz o git não achar o arquivo →
      # "Working tree clean. Nothing to commit." (bug histórico). Commit manual
      # com o caminho entre aspas resolve.
      - name: Commit & push updated DB
        if: env.NEW_DATA == 'true' || env.IRON_NEW_DATA == 'true' || env.IABR_NEW_DATA == 'true' || github.event.inputs.backfill_sh6 == 'true'
        run: |
          git config user.name  "IBBA Bot"
          git config user.email "bot@itaubba.com"
          git add "Steel and Mining/steel_sm.db"
          if git diff --staged --quiet; then
            echo "::warning::sem mudança no .db — nada a commitar."
          else
            if [ "${{ github.event.inputs.backfill_sh6 }}" = "true" ]; then
              MSG="data: popula secex_sh6_country/urf (quebras SH6xPais/URF) + dropa secex_port"
            else
              MSG="data: atualiza steel_sm.db -> ${LATEST_PERIOD}"
            fi
            git commit -m "$MSG"
            git push
            echo "✅ steel_sm.db commitado e pushado"
          fi

      # ── 7. Log final ────────────────────────────────────────────────────────
      - name: Summary
        run: |
          if [ "$NEW_DATA" = "true" ]; then
            echo "✅ Novo dado inserido: $LATEST_PERIOD — DB commitado e e-mail enviado."
          else
            echo "ℹ️  Nenhum dado novo. DB inalterado."
          fi
